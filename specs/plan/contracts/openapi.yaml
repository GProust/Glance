openapi: 3.1.0
info:
  title: Glance API
  description: |
    API for the Glance AI-driven insights platform.
    All endpoints require a Clerk session token via `Authorization: Bearer <token>`.
  version: 1.1.0

servers:
  - url: https://api.glance.ai/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

security:
  - bearerAuth: []

paths:
  /auth/me:
    get:
      summary: Current user identity
      description: Returns the authenticated user, syncing them into the database on first call.
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sources:
    get:
      summary: List the caller's registered sources
      responses:
        '200':
          description: The caller's sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Register a new source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceCreate' }
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one source
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update a source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceUpdate' }
      responses:
        '200':
          description: The updated source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove a source
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /feed:
    get:
      summary: Read-only aggregated content feed (newest first)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of feed items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeedItem' }
                  limit: { type: integer }
                  offset: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /feed/{id}:
    get:
      summary: Feed item detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The feed item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedItem' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Clerk session token.

  responses:
    Unauthorized:
      description: Missing or invalid session token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found or not owned by the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: BAD_REQUEST }
        message: { type: string }

    User:
      type: object
      properties:
        id: { type: string, description: Clerk user id, example: user_2abc... }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Source:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        type: { type: string, enum: [REPO, NEWS, SOCIAL] }
        provider: { type: string, description: 'Supported (MVP): GITHUB, RSS' }
        display_name: { type: string }
        is_active: { type: boolean }
        recurrence_interval: { type: string, example: 01:00:00 }
        config: { type: object, description: Provider-specific (validated per provider) }
        last_fetched_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SourceCreate:
      type: object
      required: [type, provider, display_name, config]
      properties:
        type: { type: string, enum: [REPO, NEWS, SOCIAL] }
        provider: { type: string, example: GITHUB }
        display_name: { type: string, maxLength: 200 }
        config:
          type: object
          description: |
            Provider-specific. GITHUB: { owner, repo, fetchLimit? }. RSS: { url, tags? }.
        recurrence: { type: string, enum: [hourly, daily, weekly] }

    SourceUpdate:
      type: object
      properties:
        display_name: { type: string, maxLength: 200 }
        config: { type: object }
        recurrence: { type: string, enum: [hourly, daily, weekly] }
        is_active: { type: boolean }

    FeedItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        external_id: { type: string }
        origin_url: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        summary: { type: [string, 'null'], description: AI-generated summary }
        published_at: { type: [string, 'null'], format: date-time }
        fetched_at: { type: string, format: date-time }
        trust_level: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        is_ai_generated: { type: boolean }
        metadata: { type: object }
        sources:
          type: object
          properties:
            type: { type: string }
            provider: { type: string }
            display_name: { type: string }
